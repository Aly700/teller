spring.application.name=teller
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.shutdown=graceful
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
logging.structured.format.console=ecs
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:3}

teller.api-key=${TELLER_API_KEY}
teller.aws.enabled=${TELLER_AWS_ENABLED:false}
teller.aws.region=${AWS_REGION:}
teller.aws.sqs.worker-enabled=${APPROVAL_WORKER_ENABLED:true}
teller.aws.sqs.queue-url=${APPROVAL_QUEUE_URL:}
teller.aws.sqs.dlq-url=${APPROVAL_DLQ_URL:}
teller.aws.sqs.wait-time-seconds=${SQS_WAIT_TIME_SECONDS:20}
teller.aws.sqs.max-messages=${SQS_MAX_MESSAGES:10}
teller.aws.sqs.poll-interval=${SQS_POLL_INTERVAL:PT1S}
teller.aws.sqs.worker-initial-delay=${SQS_WORKER_INITIAL_DELAY:PT1S}
teller.aws.s3.bucket=${AUDIT_BUCKET:}
teller.aws.s3.path-style-access-enabled=false
teller.approval.ttl=${APPROVAL_TTL:PT30M}
teller.approval.expiry-interval=${APPROVAL_EXPIRY_INTERVAL:PT1M}
teller.idempotency.ttl=${IDEMPOTENCY_TTL:PT24H}
teller.idempotency.sweep-interval=${IDEMPOTENCY_SWEEP_INTERVAL:PT1H}
teller.outbox.relay-interval=${OUTBOX_RELAY_INTERVAL:PT1S}
teller.outbox.relay-initial-delay=${OUTBOX_RELAY_INITIAL_DELAY:PT1S}
teller.export.enabled=${AUDIT_EXPORT_ENABLED:false}
teller.export.cron=${AUDIT_EXPORT_CRON:0 5 0 * * *}
